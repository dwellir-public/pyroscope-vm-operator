[tox]
no_package = True
min_version = 4.0
env_list = lint, static, unit

[testenv]
runner = uv-venv-lock-runner
set_env =
    PYTHONPATH = {tox_root}/lib:{tox_root}/src
pass_env =
    UV_CACHE_DIR
    UV_OFFLINE
    UV_PYTHON
    UV_LINK_MODE

[testenv:format]
dependency_groups = lint
commands =
    ruff check --fix src tests
    ruff format src tests

[testenv:lint]
dependency_groups = lint
commands =
    ruff check src tests
    ruff format --check src tests
    codespell README.md DEVELOPING.md ARCHITECTURE.md docs src tests

[testenv:static]
dependency_groups = lint, unit, integration
commands = pyright --pythonpath {env_python}

[testenv:unit]
dependency_groups = unit
commands =
    coverage run --source=src -m pytest -q tests/unit {posargs}
    coverage report

[testenv:integration]
dependency_groups = integration
pass_env =
    {[testenv]pass_env}
    JUJU_DATA
    JUJU_BIN
    JUJU_TEST_MODEL
    CHARM_PATH
    PYROSCOPE_APP
    COLLECTOR_APP
    TEST_COLLECTOR_UNIT
    GRAFANA_APP
    OTLP_PROFILE_FIXTURE
    OTLP_PROFILE_SERVICE
    COLLECTOR_OTLP_HTTP_PORT
commands = pytest -v tests/integration {posargs}
